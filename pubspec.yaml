name: flutter_qjs
description: This plugin is a simple js engine for flutter using the `quickjs` project. Plugin currently supports all the platforms except web!
version: 0.0.1
homepage: https://github.com/kodjodevf

environment:
  sdk: ^3.10.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.5
  code_assets: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    implements: flutter_qjs
    platforms:
      # This plugin project was generated without specifying any
      # platforms with the `--platform` argument. If you see the `fake_platform` map below, remove it and
      # then add platforms following the instruction here:
      # https://flutter.dev/docs/development/packages-and-plugins/developing-packages#plugin-platforms
      # -------------------
      windows:
        pluginClass: FlutterQjsPlugin
      linux:
        pluginClass: FlutterQjsPlugin
      android:
        pluginClass: FlutterQjsPlugin
        package: com.kodjodevf.flutter_qjs
      macos:
        pluginClass: FlutterQjsPlugin
      ios:
        pluginClass: FlutterQjsPlugin
